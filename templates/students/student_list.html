<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student List</title>
</head>

<body>

    <h1>Student List</h1>

    {% for student in students %}

        <div>
            <h2>{{ student.name }}</h2>
            <p>ID: {{ student.student_id }}</p>
            <p>Email: {{ student.email }}</p>
        </div>

        <hr>

    {% empty %}

        <p>No students found.</p>

    {% endfor %}

</body>

</html>
