<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
</head>
<body>
    <h2>Student List</h2>
    <a href="{% url 'students:student_create' %}"> Add New Student</a>
    <br><br>
    
    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Student ID</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.student_id }}</td>
                <td>{{ student.email }}</td>
                <td>{{ student.phone }}</td>
                <td>
                    <a href="{% url 'students:student_update' student.pk %}">Edit</a> | 
                    <a href="{% url 'students:student_delete' student.pk %}">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No students found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
