<!DOCTYPE html>
<html>
<head>
    <title>{% if student %}Edit Student{% else %}Add Student{% endif %}</title>
</head>
<body>
    <h2>{% if student %}Edit Student{% else %}Add New Student{% endif %}</h2>

    <form method="POST">
        {% csrf_token %}
        <label>Student ID:</label><br>
        <input type="text" name="student_id" value="{{ student.student_id|default:'' }}" required><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" value="{{ student.email|default:'' }}" required><br><br>

        <label>Phone:</label><br>
        <input type="text" name="phone" value="{{ student.phone|default:'' }}" required><br><br>

        <button type="submit">Save Student</button>
        <a href="{% url 'students:student_list' %}">Cancel</a>
    </form>
</body>
</html>
