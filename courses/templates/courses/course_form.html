<!DOCTYPE html>
<html>
<head>
    <title>{% if course %}Edit Course{% else %}Add Course{% endif %}</title>
</head>
<body>
    <h2>{% if course %}Edit Course{% else %}Add New Course{% endif %}</h2>

    <form method="POST">
        {% csrf_token %}
        <label>Course Code:</label><br>
        <input type="text" name="code" value="{{ course.code|default:'' }}" required><br><br>

        <label>Course Title:</label><br>
        <input type="text" name="title" value="{{ course.title|default:'' }}" required><br><br>

        <label>Credit Hours:</label><br>
        <input type="number" name="credit_hours" value="{{ course.credit_hours|default:'3' }}" required><br><br>

        <label>Course Fee (BDT):</label><br>
        <input type="number" step="0.01" name="course_fee" value="{{ course.course_fee|default:'0.00' }}" required><br><br>

        <label>
            <input type="checkbox" name="is_active" {% if course and course.is_active %}checked{% elif not course %}checked{% endif %}>
            Is Active
        </label><br><br>

        <button type="submit">Save Course</button>
        <a href="{% url 'courses:course_list' %}">Cancel</a>
    </form>
</body>
</html>
